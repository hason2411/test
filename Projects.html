<div class="space-y-8">
  <!-- Header Section -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Project Management</h1>
      <p class="text-slate-600 mt-2">Manage and track all CTNC projects</p>
    </div>
    <button onclick="openAddProjectModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all active:scale-95 flex items-center gap-2">
      <span class="material-symbols-outlined text-sm">add</span>
      Add Project
    </button>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
          <span class="material-symbols-outlined text-blue-600">work</span>
        </div>
        <div>
          <p class="text-2xl font-black text-slate-900" id="totalProjects">0</p>
          <p class="text-sm text-slate-500 font-medium">Total Projects</p>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
          <span class="material-symbols-outlined text-green-600">check_circle</span>
        </div>
        <div>
          <p class="text-2xl font-black text-slate-900" id="activeProjects">0</p>
          <p class="text-sm text-slate-500 font-medium">Active Projects</p>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
          <span class="material-symbols-outlined text-amber-600">schedule</span>
        </div>
        <div>
          <p class="text-2xl font-black text-slate-900" id="upcomingProjects">0</p>
          <p class="text-sm text-slate-500 font-medium">Upcoming</p>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center">
          <span class="material-symbols-outlined text-emerald-600">attach_money</span>
        </div>
        <div>
          <p class="text-2xl font-black text-slate-900" id="totalBudget">$0</p>
          <p class="text-sm text-slate-500 font-medium">Total Budget</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Projects Grid -->
  <div id="projectsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Projects will be loaded here -->
  </div>
</div>

<!-- Add Project Modal -->
<div id="addProjectModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl border border-slate-100">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-2xl font-black text-slate-900">Add New Project</h3>
      <button onclick="closeProjectModal()" class="text-slate-400 hover:text-slate-600">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <form id="addProjectForm" class="space-y-6" onsubmit="submitAddProject(event)">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Project Title</label>
        <input type="text" id="projectTitle" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Enter project title" required>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Budget ($)</label>
        <input type="number" id="projectBudget" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="0" min="0" step="0.01" required>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Start Date</label>
          <input type="date" id="projectStartDate" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">End Date</label>
          <input type="date" id="projectEndDate" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Project Lead</label>
        <select id="projectLead" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
          <option value="">Select project lead...</option>
          <!-- Leads will be loaded here -->
        </select>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="submit" id="addProjectBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">
          Create Project
        </button>
        <button type="button" onclick="closeProjectModal()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Project Details Modal -->
<div id="projectDetailsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-2xl font-black text-slate-900" id="projectDetailTitle">Project Details</h3>
      <button onclick="closeProjectDetailsModal()" class="text-slate-400 hover:text-slate-600">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div id="projectDetailsContent">
      <!-- Project details will be loaded here -->
    </div>
  </div>
</div>
