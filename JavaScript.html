  // LANGUAGE FUNCTIONS
  function setLanguage(lang) {
    currentLanguage = lang;
    localStorage.setItem('preferredLanguage', lang);
    updateLanguage();
    updateUILanguage();
  }

  function updateLanguage() {
    document.documentElement.lang = currentLanguage;
    const elements = document.querySelectorAll('[data-i18n]');
    elements.forEach(element => {
      const key = element.getAttribute('data-i18n');
      if (translations[currentLanguage][key]) {
        if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
          element.placeholder = translations[currentLanguage][key];
        } else if (element.tagName === 'OPTION') {
          element.textContent = translations[currentLanguage][key];
        } else {
          element.textContent = translations[currentLanguage][key];
        }
      }
    });

    // Update language switcher buttons
    const langVi = document.getElementById('langVi');
    const langEn = document.getElementById('langEn');
    if (currentLanguage === 'vi') {
      langVi.classList.add('bg-primary', 'text-white');
      langEn.classList.remove('bg-primary', 'text-white');
    } else {
      langEn.classList.add('bg-primary', 'text-white');
      langVi.classList.remove('bg-primary', 'text-white');
    }
  }

  function updateUILanguage() {
    // Update page title
    const pageTitles = {
      'Dashboard': currentLanguage === 'vi' ? 'Bảng điều khiển Chiến lược' : 'Strategic Dashboard',
      'Tasks': currentLanguage === 'vi' ? 'Dự án & Nhiệm vụ' : 'Projects & Tasks',
      'Inventory': currentLanguage === 'vi' ? 'Kho hàng' : 'Inventory',
      'Users': currentLanguage === 'vi' ? 'Nhân sự' : 'Personnel'
    };
    document.getElementById('pageTitle').textContent = pageTitles[currentPage] || currentPage;

    // Update sidebar active state
    const links = document.querySelectorAll('.sidebar-link');
    links.forEach(link => {
      link.classList.remove('bg-primary/10', 'text-primary-dark', 'border-primary/10');
    });

    // Reload current page content to update language
    if (currentPage) {
      loadPage(currentPage);
    }
  }

    // Load saved language preference
    const savedLang = localStorage.getItem('preferredLanguage');
    if (savedLang && ['vi', 'en'].includes(savedLang)) {
      currentLanguage = savedLang;
    }
    updateLanguage();
    loadPage('Dashboard');
    updateUserHeader();
  };

  function updateUserHeader() {
    google.script.run
      .withSuccessHandler(user => {
        // Update all user display elements
        const userDisplayNames = document.querySelectorAll('#userDisplayName');
        const userDisplayRoles = document.querySelectorAll('#userDisplayRole');
        const userWelcomeNames = document.querySelectorAll('#userWelcomeName');
        const userAvatars = document.querySelectorAll('#userAvatar');

        userDisplayNames.forEach(el => {
          if (el) el.innerText = user.name || 'Unknown User';
        });

        userDisplayRoles.forEach(el => {
          if (el) el.innerText = user.role || 'User';
        });

        userWelcomeNames.forEach(el => {
          if (el) el.innerText = user.name || 'User';
        });

        userAvatars.forEach(el => {
          if (el) el.innerText = (user.name || '?').charAt(0).toUpperCase();
        });
      })
      .withFailureHandler(error => {
        console.error('Failed to load user info:', error);
        // Set fallback values
        const userDisplayNames = document.querySelectorAll('#userDisplayName');
        const userDisplayRoles = document.querySelectorAll('#userDisplayRole');
        const userWelcomeNames = document.querySelectorAll('#userWelcomeName');
        const userAvatars = document.querySelectorAll('#userAvatar');

        userDisplayNames.forEach(el => {
          if (el) el.innerText = 'User';
        });

        userDisplayRoles.forEach(el => {
          if (el) el.innerText = 'Guest';
        });

        userWelcomeNames.forEach(el => {
          if (el) el.innerText = 'User';
        });

        userAvatars.forEach(el => {
          if (el) el.innerText = '?';
        });
      })
      .getCurrentUserInfo();
  }

  // 2. ĐIỀU HƯỚNG TRANG
  function loadPage(page) {
    currentPage = page;
    document.getElementById('pageTitle').innerText = (page === 'Dashboard') ? 'Strategic Dashboard' : page;
    
    const links = document.querySelectorAll('.sidebar-link');
    links.forEach(link => {
      link.classList.remove('bg-primary/10', 'text-primary-dark', 'border-primary/10');
      if (link.innerText.includes(page)) {
        link.classList.add('bg-primary/10', 'text-primary-dark', 'border-primary/10');
      }
    });

    const content = document.getElementById('content');
    content.innerHTML = `<div class="p-8 space-y-6"><div class="skeleton h-32 w-full rounded-2xl opacity-50"></div><div class="skeleton h-64 w-full rounded-2xl opacity-50"></div></div>`;

    google.script.run.withSuccessHandler(html => {
      content.innerHTML = html;
      if (page === 'Dashboard') loadDashboardData();
      if (page === 'Projects') {
        // Small delay to ensure DOM is ready
        setTimeout(() => {
          loadProjects();
        }, 100);
      }
      if (page === 'Inventory') {
        // Small delay to ensure DOM is ready
        setTimeout(() => {
          loadInventory();
          setupInventoryFilters();
        }, 100);
      }
      if (page === 'Tasks') loadTasks();
      if (page === 'Users') loadUsers();
    }).getPageContent(page);
  }

  // 3. LOGIC DASHBOARD (BIỂU ĐỒ & FEED)
  function loadDashboardData() {
    google.script.run.withSuccessHandler(data => {
      if(document.getElementById('activeProjectsCount')) document.getElementById('activeProjectsCount').innerText = Number(data.totalProjects || data.projects || 0).toLocaleString();
      if(document.getElementById('fieldEquipCount')) document.getElementById('fieldEquipCount').innerText = Number(data.equip || 0).toLocaleString();
      if(document.getElementById('pendingReqCount')) document.getElementById('pendingReqCount').innerText = Number(data.pending || 0).toLocaleString();

      // Update trend / completion rate display if present
      try {
        const completion = Number(data.completionRate || 0);
        const trends = document.querySelectorAll('.stat-card .trend-up, .stat-card .trend-down');
        if (trends && trends.length > 0) {
          // Set first stat-card to show completion rate
          if (trends[0]) trends[0].textContent = `↗ ${completion}% completed`;
        }
      } catch (e) {
        console.warn('Failed to render trends:', e);
      }

      renderChart(data.workload);
      renderFeed(data.feed);
    }).getDashboardStats();
  }

  function renderChart(workloadData) {
    const ctx = document.getElementById('workloadChart')?.getContext('2d');
    if(!ctx) return;
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: workloadData.labels,
        datasets: [{
          data: workloadData.values,
          backgroundColor: '#11d462',
          borderRadius: 8,
          barThickness: 24
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: { 
          y: { beginAtZero: true, grid: { color: '#f1f5f9' }, border: { display: false } },
          x: { grid: { display: false }, border: { display: false } }
        }
      }
    });
  }

  function renderFeed(feedData) {
    const container = document.getElementById('weeklyFeed');
    if(!container) return;
    
    if (feedData.length === 0) {
      container.innerHTML = `<p class="text-xs text-slate-400 text-center py-10" data-i18n="no_recent_activities">No recent activities</p>`;
      return;
    }
    
    container.innerHTML = feedData.map(item => {
      const isPost = item.type === 'post';
      const isPinned = item.isPinned;
      
      let actions = '';
      if (isPost) {
        actions = `
          <div class="flex gap-2 mt-3">
            <button onclick="togglePin('${item.id}')" class="text-xs px-2 py-1 rounded-lg font-bold transition ${isPinned ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}" title="${isPinned ? 'Unpin' : 'Pin'}">
              📌 ${isPinned ? translations[currentLanguage]['unpin'] || 'Unpin' : translations[currentLanguage]['pinned'] || 'Pin'}
            </button>
            <button onclick="markPostDone('${item.id}')" class="text-xs px-2 py-1 rounded-lg font-bold bg-blue-100 text-blue-700 hover:bg-blue-200 transition" title="Mark as Done">
              ✅ ${translations[currentLanguage]['done'] || 'Done'}
            </button>
          </div>
        `;
      }
      
      return `
        <div class="feed-item p-4 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md transition-all ${isPinned ? 'ring-2 ring-emerald-200 bg-emerald-50/30' : ''}">
          <div class="flex gap-4">
            <div class="size-10 ${isPost ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'} rounded-xl flex-shrink-0 flex items-center justify-center font-bold text-xs">
              ${isPost ? '📝' : '🔄'}
            </div>
            <div class="flex-1">
              <div class="flex justify-between items-center mb-1">
                <div class="flex items-center gap-2">
                  <h4 class="font-bold text-sm text-slate-800">${item.name}</h4>
                  ${isPinned ? '<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-bold">📌 PINNED</span>' : ''}
                </div>
                <span class="text-[10px] text-slate-400 font-bold">${item.time}</span>
              </div>
              <p class="text-xs text-slate-600 leading-relaxed ${isPost ? 'mb-2' : ''}">${item.content}</p>
              ${isPost ? actions : `<div class="mt-2"><span class="bg-slate-50 text-slate-500 px-2 py-1 rounded-lg text-[9px] font-bold uppercase tracking-wider">#${item.tag}</span></div>`}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // 4. LOGIC INVENTORY - Optimized for new interface
  function loadInventory(forceRefresh = false) {
    // Show loading state immediately
    showLoadingState();

    // Use Promise.race for timeout handling
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error('Request timeout after 8 seconds')), 8000);
    });

    const requestPromise = new Promise((resolve, reject) => {
      if (forceRefresh) {
        // Clear cache before loading
        google.script.run
          .withSuccessHandler(() => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .getInventoryData();
          })
          .withFailureHandler(reject)
          .clearInventoryCache();
      } else {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getInventoryData();
      }
    });

    Promise.race([requestPromise, timeoutPromise])
      .then(data => {
        if (!Array.isArray(data)) {
          throw new Error('Invalid data format received');
        }
        window.inventoryData = data; // Store for filtering
        renderInventory(data);
      })
      .catch(error => {
        console.error('Failed to load inventory:', error);
        showErrorState(error.message);
      });
  }

  function showLoadingState() {
    const container = document.getElementById('inventoryListContainer');
    const loadingState = document.getElementById('loadingState');
    const equipmentGrid = document.getElementById('equipmentGrid');
    const emptyState = document.getElementById('emptyState');

    if (container && loadingState && equipmentGrid && emptyState) {
      loadingState.classList.remove('hidden');
      equipmentGrid.classList.add('hidden');
      emptyState.classList.add('hidden');
    }
  }

  function showErrorState(message) {
    const container = document.getElementById('inventoryListContainer');
    if (container) {
      container.innerHTML = `
        <div class="text-center py-12">
          <div class="mx-auto w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-4">
            <span class="material-symbols-outlined text-red-600 text-2xl">error</span>
          </div>
          <h3 class="text-lg font-medium text-slate-900 mb-2">Failed to load inventory</h3>
          <p class="text-slate-600 mb-6">${message}</p>
          <button onclick="loadInventory(true)" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
            <span class="material-symbols-outlined text-sm">refresh</span>
            Try Again
          </button>
        </div>
      `;
    }
  }

  function renderInventory(data) {
    // Update stats cards first
    updateStatsCards(data);

    // Apply filters
    const filteredData = applyFilters(data);

    // Update item count
    updateItemCount(filteredData.length);

    // Show appropriate state
    if (filteredData.length === 0) {
      showEmptyState();
      return;
    }

    // Render equipment grid
    renderEquipmentGrid(filteredData);
  }

  function updateStatsCards(data) {
    const total = data.length;
    const inUse = data.filter(r => r && r[4] === 'Borrowed').length;
    const maintenance = data.filter(r => r && r[4] === 'Broken').length;
    const available = total - inUse - maintenance;

    // Update stat elements
    const statElements = {
      'statTotal': total,
      'statAvailable': available,
      'statInUse': inUse,
      'statMaintenance': maintenance
    };

    Object.entries(statElements).forEach(([id, value]) => {
      const element = document.getElementById(id);
      if (element) {
        element.textContent = value;
      }
    });
  }

  function applyFilters(data) {
    const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
    const statusFilter = document.getElementById('statusFilter')?.value || 'all';

    return data.filter(row => {
      if (!row || row.length < 6) return false;

      // Search filter: name or serial number
      const matchesSearch = (row[1] || '').toLowerCase().includes(searchTerm) ||
                           (row[2] || '').toLowerCase().includes(searchTerm);

      // Status filter
      const matchesStatus = statusFilter === 'all' ||
                           (statusFilter === 'Available' && row[4] === 'Available') ||
                           (statusFilter === 'Borrowed' && row[4] === 'Borrowed') ||
                           (statusFilter === 'Broken' && row[4] === 'Broken');

      return matchesSearch && matchesStatus;
    });
  }

  function updateItemCount(count) {
    const itemCountElement = document.getElementById('itemCount');
    if (itemCountElement) {
      itemCountElement.textContent = `${count} item${count !== 1 ? 's' : ''}`;
    }
  }

  function showEmptyState() {
    const loadingState = document.getElementById('loadingState');
    const equipmentGrid = document.getElementById('equipmentGrid');
    const emptyState = document.getElementById('emptyState');

    if (loadingState && equipmentGrid && emptyState) {
      loadingState.classList.add('hidden');
      equipmentGrid.classList.add('hidden');
      emptyState.classList.remove('hidden');
    }
  }

  function renderEquipmentGrid(filteredData) {
    const equipmentGrid = document.getElementById('equipmentGrid');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');

    if (!equipmentGrid) return;

    // Generate equipment cards
    const cardsHtml = filteredData.map(row => createEquipmentCard(row)).join('');

    // Update DOM
    equipmentGrid.innerHTML = cardsHtml;

    // Show grid, hide others
    equipmentGrid.classList.remove('hidden');
    if (loadingState) loadingState.classList.add('hidden');
    if (emptyState) emptyState.classList.add('hidden');
  }

  function createEquipmentCard(row) {
    const [id, name, serial, condition, status, holder] = row;
    const statusConfig = getStatusConfig(status);
    const actionButton = getActionButton(id, status);

    return `
      <div class="bg-white rounded-xl border border-slate-200 p-6 hover:shadow-lg hover:border-slate-300 transition-all duration-200 group">
        <div class="flex items-start justify-between mb-4">

  // Toast notification functions
  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastMessage = document.getElementById('toastMessage');

    if (!toast || !toastIcon || !toastMessage) return;

    // Set icon and colors based on type
    const iconConfigs = {
      success: '<span class="material-symbols-outlined text-green-600">check_circle</span>',
      error: '<span class="material-symbols-outlined text-red-600">error</span>',
      info: '<span class="material-symbols-outlined text-blue-600">info</span>'
    };

    toastIcon.innerHTML = iconConfigs[type] || iconConfigs.info;
    toastMessage.textContent = message;

    // Show toast
    toast.classList.remove('hidden');

    // Auto-hide after 4 seconds
    setTimeout(() => {
      hideToast();
    }, 4000);
  }

  function hideToast() {
    const toast = document.getElementById('toast');

    const btn = document.getElementById('submitBtn');

    const data = [1,2,3,4,5,6].map(i => document.getElementById('f'+i)?.value || "");

function populateAssigneeSelect(users) {
  const select = document.getElementById('f3');
  if (!select) return;

  let html = `<option value="" disabled selected>-- Chọn nhân sự thực hiện --</option>`;
  
  users.forEach(u => {
    if (u.isBusy) {
      // Logic hiển thị chi tiết khi bận
      const details = u.busyDetails;
      const dayText = details.daysLeft >= 0 ? `${details.daysLeft} ngày nữa` : `Quá hạn ${Math.abs(details.daysLeft)} ngày`;
      
      // Format text hiển thị trong dropdown
      // Ví dụ: 🔴 Vinh (BẬN: Làm báo cáo | Hạn: 2 ngày nữa | Giao bởi: Sơn)
      const busyText = `🔴 ${u.name} (BẬN: ${details.taskName} | Hạn: ${dayText} | Giao bởi: ${details.assigner})`;
      
      html += `<option value="${u.name}" disabled class="bg-slate-100 text-slate-400 font-medium italic">${busyText}</option>`;
    } else {
      // Người rảnh
      html += `<option value="${u.name}" class="text-slate-900 font-bold">🟢 ${u.name} - ${u.role}</option>`;
    }
  });
  
  select.innerHTML = html;
}

  if (!data || data.length === 0) {
    container.innerHTML = `
      <div class="col-span-full text-center py-12">
        <div class="mx-auto w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
          <span class="material-symbols-outlined text-slate-400 text-2xl">work</span>
        </div>
        <h3 class="text-lg font-medium text-slate-900 mb-2">No projects yet</h3>
        <p class="text-slate-600 mb-6">Get started by creating your first project</p>
        <button onclick="openAddProjectModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
          <span class="material-symbols-outlined text-sm">add</span>
          Add Project
        </button>
      </div>
    `;
    return;
  }

  container.innerHTML = data.map(row => createProjectCard(row)).join('');
}

function updateProjectStats(data) {
  const now = new Date();
  let total = data.length;
  let active = 0;
  let upcoming = 0;
  let totalBudget = 0;

  data.forEach(row => {
    const [id, title, budget, startDate, endDate, leadId] = row;
    const start = new Date(startDate);
    const end = new Date(endDate);

    totalBudget += parseFloat(budget) || 0;

    if (now < start) {
      upcoming++;
    } else if (now <= end) {
      active++;
    }
  });

  document.getElementById('totalProjects').textContent = total;
  document.getElementById('activeProjects').textContent = active;
  document.getElementById('upcomingProjects').textContent = upcoming;
  document.getElementById('totalBudget').textContent = '$' + totalBudget.toLocaleString();
}

function createProjectCard(row) {
  const [id, title, budget, startDate, endDate, leadId] = row;
  const now = new Date();
  const start = new Date(startDate);
  const end = new Date(endDate);

  let status, statusColor, statusText;
  if (now < start) {
    status = 'upcoming';
    statusColor = 'bg-amber-100 text-amber-800 border-amber-200';
    statusText = 'Upcoming';
  } else if (now <= end) {
    status = 'active';
    statusColor = 'bg-green-100 text-green-800 border-green-200';
    statusText = 'Active';
  } else {
    status = 'completed';
    statusColor = 'bg-slate-100 text-slate-800 border-slate-200';
    statusText = 'Completed';
  }

  const progress = calculateProjectProgress(start, end, now);
  const budgetFormatted = '$' + parseFloat(budget).toLocaleString();

  return `
    <div class="bg-white rounded-xl border border-slate-200 p-6 hover:shadow-lg transition-all duration-200 group cursor-pointer" onclick="openProjectDetails('${id}')">
      <div class="flex items-start justify-between mb-4">
        <div class="flex-1">
          <h3 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors mb-2">${title}</h3>
          <div class="flex items-center gap-2 mb-3">
            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium ${statusColor} border">
              ${statusText}
            </span>
            <span class="text-sm text-slate-500">${budgetFormatted}</span>
          </div>
        </div>
        <div class="text-right">
          <p class="text-sm text-slate-500">${start.toLocaleDateString()}</p>
          <p class="text-sm text-slate-500">to</p>
          <p class="text-sm text-slate-500">${end.toLocaleDateString()}</p>
        </div>
      </div>

      <div class="space-y-3">
        <div class="flex justify-between text-sm">
          <span class="text-slate-600">Progress</span>
          <span class="font-medium">${progress}%</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2">
          <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
        </div>
      </div>
    </div>
  `;
}

function calculateProjectProgress(start, end, now) {
  if (now < start) return 0;
  if (now > end) return 100;

  const totalDuration = end - start;
  const elapsed = now - start;
  return Math.round((elapsed / totalDuration) * 100);
}

function openAddProjectModal() {
  const modal = document.getElementById('addProjectModal');
  if (modal) {
    modal.classList.remove('hidden');
    // Load project leads
    google.script.run
      .withSuccessHandler(leads => {
        const select = document.getElementById('projectLead');
        if (select) {
          select.innerHTML = '<option value="">Select project lead...</option>' +
            leads.map(lead => `<option value="${lead[0]}">${lead[1]}</option>`).join('');
        }
      })
      .getUsersData();
  }
}

function closeProjectModal() {
  const modal = document.getElementById('addProjectModal');
  if (modal) {
    modal.classList.add('hidden');
    clearProjectForm();
  }
}

function clearProjectForm() {
  const form = document.getElementById('addProjectForm');
  if (form) form.reset();
}

function submitAddProject(event) {
  event.preventDefault();

  const title = document.getElementById('projectTitle').value.trim();
  const budget = document.getElementById('projectBudget').value;
  const startDate = document.getElementById('projectStartDate').value;
  const endDate = document.getElementById('projectEndDate').value;
  const leadId = document.getElementById('projectLead').value;

  if (!title || !budget || !startDate || !endDate || !leadId) {
    showToast('Please fill in all required fields', 'error');
    return;
  }

  // Additional client-side validation
  const bnum = Number(budget);
  if (isNaN(bnum) || bnum <= 0) {
    showToast('Budget must be a positive number', 'error');
    return;
  }
  const s = new Date(startDate);
  const e = new Date(endDate);
  if (isNaN(s.getTime()) || isNaN(e.getTime())) {
    showToast('Invalid start or end date', 'error');
    return;
  }
  if (s > e) {
    showToast('Start date must be before or equal to End date', 'error');
    return;
  }

  const btn = document.getElementById('addProjectBtn');
  btn.disabled = true;
  btn.textContent = 'Creating...';

  google.script.run
    .withSuccessHandler((response) => {
      console.log('addProject response:', response);
      btn.disabled = false;
      btn.textContent = 'Create Project';
      closeProjectModal();
      showToast('Project created successfully!', 'success');
      loadProjects();
    })
    .withFailureHandler(error => {
      console.error('addProject error:', error);
      btn.disabled = false;
      btn.textContent = 'Create Project';
      showToast('Failed to create project: ' + (error && error.message ? error.message : error), 'error');
    })
    .addProject([title, budget, startDate, endDate, leadId]);
}

function openProjectDetails(projectId) {
  google.script.run
    .withSuccessHandler(project => {
      const modal = document.getElementById('projectDetailsModal');
      const title = document.getElementById('projectDetailTitle');
      const content = document.getElementById('projectDetailsContent');

      if (modal && title && content) {
        title.textContent = project.title;
        content.innerHTML = `
          <div class="space-y-6">
            <div class="grid grid-cols-2 gap-6">
              <div>
                <h4 class="font-bold text-slate-900 mb-2">Project Details</h4>
                <div class="space-y-2 text-sm">
                  <p><span class="font-medium">ID:</span> ${project.id}</p>
                  <p><span class="font-medium">Title:</span> ${project.title}</p>
                  <p><span class="font-medium">Budget:</span> $${parseFloat(project.budget).toLocaleString()}</p>
                  <p><span class="font-medium">Start Date:</span> ${new Date(project.startDate).toLocaleDateString()}</p>
                  <p><span class="font-medium">End Date:</span> ${new Date(project.endDate).toLocaleDateString()}</p>
                  <p><span class="font-medium">Project Lead:</span> ${project.leadName || 'Unknown'}</p>
                </div>
              </div>
              <div>
                <h4 class="font-bold text-slate-900 mb-2">Progress</h4>
                <div class="space-y-3">
                  <div class="flex justify-between text-sm">
                    <span>Completion</span>
                    <span class="font-medium">${project.progress}%</span>
                  </div>
                  <div class="w-full bg-slate-200 rounded-full h-3">
                    <div class="bg-blue-600 h-3 rounded-full" style="width: ${project.progress}%"></div>
                  </div>
                  <p class="text-xs text-slate-500 mt-2">${project.status}</p>
                </div>
              </div>
            </div>
          </div>
        `;
        modal.classList.remove('hidden');
      }
    })
    .getProjectDetails(projectId);
}

function closeProjectDetailsModal() {
  const modal = document.getElementById('projectDetailsModal');
  if (modal) {
    modal.classList.add('hidden');
  }
}
</script>
